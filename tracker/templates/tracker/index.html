{% load static %}

<link rel="stylesheet" href="{% static 'tracker/style.css' %}">

{% if product_list %}
    <ul>
    {% for product in product_list %}
        <li><a href="{% url 'tracker:detail' product.id %}">{{ product.product_name }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No products are available.</p>
{% endif %}
